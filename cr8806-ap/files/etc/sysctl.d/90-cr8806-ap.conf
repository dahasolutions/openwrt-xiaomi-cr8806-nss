# eth0 (GMAC0) nhan ban sao broadcast khong co tag tu switch; tag driver qca-8021q bo goi va in
# "eth0: dropped frame from ..." lien tuc, day kin log 128 KB trong vai phut (mat log hostapd).
# Gioi han canh bao net_ratelimit: toi da 2 dong moi 5 phut.
net.core.message_cost=300
net.core.message_burst=2
